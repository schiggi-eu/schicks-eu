<div class="btn-row">

</div>

<h2 id="liste">Liste</h2>

<p class="lead">Die Grundform steht da – schreib simple past und past participle.</p>
<div class="settings">
  <label for="verb-count">Anzahl Verben</label>
  <select id="verb-count">
    <option value="10">10</option>
    <option value="20" selected>20</option>
    <option value="0">alle</option>
  </select>
  <div class="btn-row"><button class="btn" id="verb-start">▶ Test starten</button></div>
</div>
<div class="quiz" id="verb-test"></div>
