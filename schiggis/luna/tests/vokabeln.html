<div class="crumbs"><a href="../index.html">Start</a> › <a href="../tests/index.html">Tests</a> › Vokabeltest</div>
<h1>Vokabeltest</h1>
<p class="lead">Wähle Abschnitte und Testart, dann los! Falsche Wörter landen automatisch in deinen <strong>Fehlerwörtern</strong>.</p>

<div class="settings">
  <label>Abschnitte</label>
  <div class="chips" id="vt-chips"></div>
  <div class="grid two">
    <div>
      <label for="vt-mode">Testart</label>
      <select id="vt-mode">
        <option value="de-en">Deutsch → Englisch (eintippen)</option>
        <option value="en-de">Englisch → Deutsch (ankreuzen)</option>
        <option value="satz">Lückensatz (eintippen)</option>
      </select>
    </div>
    <div>
      <label for="vt-count">Anzahl Wörter</label>
      <select id="vt-count">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="0">alle</option>
      </select>
    </div>
  </div>
  <div class="btn-row"><button class="btn" id="vt-start">▶ Test starten</button></div>
</div>

<div class="quiz" id="vocab-test"></div>
<p class="de">Beim Eintippen kannst du „to“ vor Verben weglassen. Was in Klammern steht (z. B. „(of)“ oder „(do sth)“), musst du nicht mittippen.</p>

</main>
