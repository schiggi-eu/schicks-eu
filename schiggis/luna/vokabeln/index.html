<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="bingbot" content="noindex, nofollow">
<title>Vokabeln · Luna</title>
<meta name="theme-color" content="#00d2ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luna">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="icon" type="image/png" href="../assets/icon-180.png">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root="../" data-page="vokabeln">
<main>
<h1>Vokabeln Unit 1</h1>

<div class="btn-row" role="tablist">
  <button class="btn teal" id="tab-karten" role="tab">🃏 Karteikarten</button>
  <button class="btn ghost" id="tab-test" role="tab">✍️ Vokabeltest</button>
</div>

<section id="sec-karten">
  <div class="settings">
    <label for="flash-dir">Richtung</label>
    <select id="flash-dir">
      <option value="en-de">Englisch → Deutsch</option>
      <option value="de-en">Deutsch → Englisch</option>
    </select>
    <label>Abschnitte</label>
    <div class="chips" id="flash-chips"></div>
  </div>
  <div class="flash-wrap" id="vocab-flash"></div>
</section>

<section id="sec-test" hidden>
  <p class="lead">Deutsch steht da – schreib das englische Wort. „to“ vor Verben kannst du weglassen.</p>
  <div class="settings">
    <label>Abschnitte</label>
    <div class="chips" id="vt-chips"></div>
    <label for="vt-count">Anzahl Wörter</label>
    <select id="vt-count">
      <option value="10">10</option>
      <option value="20" selected>20</option>
      <option value="0">alle</option>
    </select>
    <div class="btn-row"><button class="btn" id="vt-start">▶ Test starten</button></div>
  </div>
  <div class="quiz" id="vocab-test"></div>
</section>

<script>
(function () {
  var tk = document.getElementById("tab-karten"), tt = document.getElementById("tab-test");
  var sk = document.getElementById("sec-karten"), st = document.getElementById("sec-test");
  function show(k) {
    var test = k === "test";
    sk.hidden = test; st.hidden = !test;
    tk.className = "btn " + (test ? "ghost" : "teal");
    tt.className = "btn " + (test ? "teal" : "ghost");
  }
  tk.onclick = function () { show("karten"); history.replaceState(null, "", "#karten"); };
  tt.onclick = function () { show("test"); history.replaceState(null, "", "#test"); };
  if (location.hash === "#test") show("test");
})();
</script>

</main>
<script src="../assets/data/vocab.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
